<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuleSoft Architecture</title>
<style>
:root{
  --navy:#052D60; --teal:#0BA49B; --indigo:#5E66F9;
  --band:#EFF8FF; --text:#464D55; --title:#052D60;
  --badge-bg:#F1F1F1; --badge-text:#002196; --mule:#00A0DF;
  --line:#D8E3F0; --ink:#1B2733; --muted:#7B8794;
  --card:#FFFFFF; --bg:#F4F7FB;
  /* LAYER identity only (validated: lightness, chroma, CVD, contrast) */
  --exp:#1E64B0; --proc:#0BA49B; --sys:#5E66F9; --oth:#9AA5B1;
  /* VALUE: plain magnitudes, count badges, numbers */
  --val:#052D60;
  /* ORDINAL buckets (2+/1/0 consumers, platform tiers, maturity) - one hue, dark->light */
  --ord1:#052D60; --ord2:#5A6B82; --ord3:#A7B2C1;
  /* REUSE family - orange means "reuse" everywhere (validated --ordinal ramp, dark = most reused) */
  --reuse1:#B83A0A; --reuse2:#E8702A; --reuse3:#F2A066; --reuse-bg:#FEF1E7; --reuse-tx:#A8350A;
  /* STATUS - reserved, always with a text label */
  --ok:#0B8A3E; --ok-bg:#E6F4EC; --ok-tx:#0B7A3B;
  --warn:#F2B33D; --warn-bg:#FFF4DE; --warn-tx:#8A5A00;
  --bad:#C0392B; --bad-bg:#FDECEA; --bad-tx:#A8322A;
  /* FLOW DIRECTION on Integration Flows only */
  --calls:#1B2733; --calledby:#C2255C;
  --shadow:0 6px 18px rgba(5,45,96,.10),0 1px 3px rgba(5,45,96,.08);
  --shadow-sm:0 2px 6px rgba(5,45,96,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Salesforce Sans","Helvetica Neue",Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color:var(--text); background:var(--bg); -webkit-font-smoothing:antialiased; line-height:1.45;
}
a{color:var(--badge-text);text-decoration:none}

/* ── Header ─────────────────────────────────────────── */
header{
  background:linear-gradient(120deg,#052D60 0%,#0A3E7E 55%,#0BA49B 160%);
  color:#fff; padding:26px 40px 0; position:relative; overflow:hidden;
}
header::after{content:"";position:absolute;right:-80px;top:-60px;width:340px;height:340px;
  background:radial-gradient(circle,rgba(94,102,249,.35),transparent 70%);pointer-events:none}
.h-top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;position:relative;z-index:1}
.h-brand{display:flex;align-items:center;gap:14px}
.h-logo{width:46px;height:46px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(0,160,223,.45);flex:0 0 auto;padding:6px}
.h-logo img{width:100%;height:100%;object-fit:contain;display:block}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.2px}
.h-sub{font-size:13px;opacity:.85;margin-top:2px;font-weight:400}
.h-meta{text-align:right;font-size:12px;opacity:.82;line-height:1.7}
.h-meta b{color:#fff;font-weight:600}
.pill{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);
  padding:2px 10px;border-radius:999px;font-size:11px;font-weight:600;margin-left:6px}

/* ── Tabs ───────────────────────────────────────────── */
nav.tabs{display:flex;gap:2px;margin-top:22px;position:relative;z-index:1;flex-wrap:wrap}
nav.tabs button{
  background:transparent;border:0;color:rgba(255,255,255,.72);font:inherit;font-size:13.5px;font-weight:600;
  padding:12px 18px;cursor:pointer;border-radius:10px 10px 0 0;display:flex;align-items:center;gap:8px;transition:.15s;
}
nav.tabs button .tico{width:16px;height:16px;opacity:.8}
nav.tabs button:hover{color:#fff;background:rgba(255,255,255,.08)}
nav.tabs button.active{background:var(--bg);color:var(--title)}
nav.tabs button.active .tico{opacity:1}

/* ── Layout ─────────────────────────────────────────── */
main{padding:28px 40px 60px;max-width:1400px;margin:0 auto}
main.wide{max-width:none;padding-left:24px;padding-right:24px}
.panel{display:none;animation:fade .25s ease}
.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2.sec{font-size:17px;color:var(--title);margin:0 0 4px;font-weight:700}
.sec-desc{font-size:13px;color:var(--muted);margin:0 0 18px;max-width:820px}
.block{margin-bottom:34px}

/* ── KPI cards ──────────────────────────────────────── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:26px}
.kpi{background:var(--card);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .num{font-size:30px;font-weight:800;color:var(--title);line-height:1}
.kpi .lbl{font-size:12px;color:var(--muted);margin-top:6px;font-weight:600;letter-spacing:.2px}
.kpi .ic{position:absolute;right:12px;top:12px;width:22px;height:22px;opacity:.28}
.kpi .num small{font-size:15px;font-weight:700;color:var(--muted)}

.cols{display:grid;grid-template-columns:1.3fr 1fr;gap:24px}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:20px 22px}
.card h3{margin:0 0 14px;font-size:14px;color:var(--title);font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 svg{width:17px;height:17px}

/* env bars */
.envbar{margin-bottom:14px}
.envbar .top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.envbar .top .nm{font-weight:600;color:var(--ink)}
.envbar .top .nm .tag{font-size:10px;font-weight:700;padding:1px 7px;border-radius:6px;margin-left:7px;text-transform:uppercase;letter-spacing:.4px}
.tag.prod{background:var(--val);color:#fff}
.tag.sandbox{background:var(--band);color:var(--muted);border:1px solid var(--line)}
.envbar .top .ct{color:var(--muted);font-weight:600}
.track{height:10px;border-radius:6px;background:#EDF1F6;overflow:hidden;display:flex}
.track .run{background:var(--ok)}
.track .stop{background:var(--warn)}
.legend{display:flex;gap:16px;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}

/* domain chips */
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{background:var(--band);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:12.5px;color:var(--ink);
  display:flex;align-items:center;gap:8px;font-weight:600}
.chip b{color:var(--val);font-weight:800}
.lgroup{display:flex;flex-wrap:wrap;gap:8px}
.lchip{font-size:12px;padding:5px 11px;border-radius:8px;color:#fff;font-weight:700}

/* ── Architecture swimlanes ─────────────────────────── */
.arch{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:22px 24px 26px}
.tier-row{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin:6px 0 14px}
.node-ico{display:flex;flex-direction:column;align-items:center;gap:6px;width:104px}
.node-ico .disc{width:52px;height:52px;border-radius:14px;background:#fff;box-shadow:var(--shadow-sm);
  display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.node-ico .disc svg{width:30px;height:30px}
.node-ico .disc img{width:32px;height:32px;object-fit:contain}
.node-ico .cap{font-size:11px;text-align:center;color:var(--ink);font-weight:600;line-height:1.25}
.conn{height:16px;position:relative}
.conn::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--line);transform:translateX(-50%)}

.lane{display:flex;align-items:stretch;gap:0;margin-bottom:10px;border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm)}
.lane .side{flex:0 0 116px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;
  text-align:center;padding:10px;line-height:1.25}
.lane .side small{display:block;font-size:10.5px;font-weight:600;opacity:.85;margin-top:3px}
.lane.experience .side{background:var(--exp)}
.lane.process .side{background:var(--proc)}
.lane.system .side{background:var(--sys)}
.lane.other .side{background:var(--oth)}
.api .badges{position:absolute;top:-7px;right:-7px;display:flex;gap:4px;align-items:center}
.api .badges .badge{position:static}
.api .badge.calls,.api .badge.fromint{background:var(--ord2)}
.isopill{display:inline-block;margin-left:8px;font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.3px;color:var(--warn-tx);background:var(--warn-bg);border:1px solid #F0D9B0;vertical-align:1px}
.lane .band{flex:1;background:var(--band);padding:14px;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:10px;align-content:start;align-items:stretch}
.api{background:#fff;border-radius:9px;box-shadow:var(--shadow-sm);padding:9px 12px 9px 9px;display:flex;align-items:center;gap:9px;
  min-width:0;cursor:default;transition:.14s;border:1px solid transparent;position:relative}
.api:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(5,45,96,.16);border-color:var(--line)}
.api .mi{width:30px;height:30px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.api .mi img{width:28px;height:28px;object-fit:contain;display:block}
.api .txt{min-width:0;display:flex;flex-direction:column;justify-content:center}
.api .nm{font-size:11.5px;font-weight:600;color:var(--ink);line-height:1.22;word-break:break-word}
.api .badge{position:absolute;top:-7px;right:-7px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--navy);
  color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm)}
.api .dtag{font-size:9px;color:#fff;background:var(--ord2);padding:1px 6px;border-radius:5px;font-weight:700;margin-top:3px;display:inline-block}
.archnote{font-size:11.5px;color:var(--muted);margin-top:12px;display:flex;gap:20px;flex-wrap:wrap}
.archnote span{display:flex;align-items:center;gap:7px}

/* ── Flows graph (SVG) ──────────────────────────────── */
.graph-wrap{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:18px 10px 10px;overflow:hidden}
.graph-controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:0 14px 12px;font-size:12px;color:var(--muted)}
.graph-controls .col-key{display:flex;gap:14px;flex-wrap:wrap}
.graph-controls .col-key span{display:flex;align-items:center;gap:6px;font-weight:600}
.flow-filters{display:flex;gap:6px;flex-wrap:wrap}
.filt{background:var(--band);border:1px solid var(--line);border-radius:7px;padding:4px 11px;font:inherit;font-size:11.5px;font-weight:600;color:var(--ink);cursor:pointer;transition:.12s}
.filt:hover{background:#E3EAF5}
.filt.active{background:var(--navy);color:#fff;border-color:var(--navy)}
#flowSearch{padding:5px 10px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:12px;min-width:160px;background:#fff}
/* Canvas fills the available viewport height (min 480px); content scrolls inside. */
.graph-scroll{overflow:auto;height:max(560px,calc(100vh - 200px));border-radius:0 0 8px 8px;position:relative;
  cursor:grab;background:linear-gradient(#fff,#fff)}
.graph-scroll.panning{cursor:grabbing;user-select:none}
#flowsvg{display:block;margin:0 auto}
#flowsvg text{font-family:inherit}
.zoom-ctl{display:flex;align-items:center;gap:4px}
.zoom-ctl button{width:28px;height:26px;border:1px solid var(--line);background:#fff;border-radius:6px;font:inherit;
  font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;line-height:1}
.zoom-ctl button.wide{width:auto;padding:0 9px;font-size:11.5px;font-weight:600}
.zoom-ctl button:hover{background:var(--band)}
.zoom-ctl .zlvl{min-width:42px;text-align:center;font-weight:600;font-size:11.5px;color:var(--muted)}
.dir-key{display:flex;gap:14px;align-items:center;font-size:11.5px;color:var(--muted);font-weight:600}
.view-toggle{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-right:6px}
.vbtn{background:#fff;border:0;padding:5px 11px;font:inherit;font-size:11.5px;font-weight:600;color:var(--ink);cursor:pointer}
.vbtn + .vbtn{border-left:1px solid var(--line)}
.vbtn.active{background:var(--navy);color:#fff}
.gedge.circ{stroke-width:1.1;opacity:.45}
svg.dim .gedge.circ{opacity:.04}
.gnode.circ .glabel{font-weight:600}
.gnode.circ:hover .glabel{font-weight:700}
.gnode.circ .gdot{stroke:#fff;stroke-width:2}
.gnode.circ .ghit{fill:transparent;pointer-events:all}
.gnode.circ:hover .ghit{fill:rgba(30,100,176,.07)}
.gnode.circ:hover .gdot{r:6.5}
.gnode.circ.sel .gdot{stroke:var(--navy);stroke-width:2.5}
.gnode.circ.sel .glabel{font-weight:700}
.dir-key span{display:flex;align-items:center;gap:6px}
.gnode rect,.gnode circle{transition:.15s}
.gnode .glabel{font-size:10.5px;fill:var(--ink);font-weight:600;pointer-events:none}
.gedge{fill:none;stroke:#B7C6D9;stroke-width:1.3;transition:.15s;opacity:.7}
svg.dim .gedge{opacity:.05}
svg.dim .gnode{opacity:.18}
svg.dim .gnode.hl{opacity:1}
/* Selected tile: blue = calls (outgoing), amber = called by (incoming). Arrowheads carry direction too. */
#flowsvg .gedge.out{opacity:1;stroke:var(--calls);stroke-width:2.2}
#flowsvg .gedge.in{opacity:1;stroke:var(--calledby);stroke-width:2.2}
.gnode{cursor:pointer;opacity:1;transition:.15s}
.gnode .gcard{fill:#fff;stroke:var(--line);stroke-width:1}
.gnode:hover .gcard{stroke:#9AA5B1}
.gnode.sel .gcard{stroke:var(--navy);stroke-width:2}
.flowtip{position:fixed;pointer-events:none;background:var(--navy);color:#fff;padding:8px 11px;border-radius:8px;
  font-size:11.5px;box-shadow:0 6px 20px rgba(0,0,0,.3);opacity:0;transition:.1s;z-index:99;max-width:240px;line-height:1.4}
.flowtip b{color:#7FE9DF}

/* ── Inventory table ────────────────────────────────── */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input[type=search]{flex:1;min-width:200px;padding:9px 13px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:13px;background:#fff}
.toolbar select{padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:13px;background:#fff;color:var(--ink)}
.toolbar .count{font-size:12px;color:var(--muted);font-weight:600;margin-left:auto}
.tbl-wrap{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{background:#F0F5FB;color:var(--title);text-align:left;padding:11px 14px;font-weight:700;font-size:11.5px;
  text-transform:uppercase;letter-spacing:.4px;cursor:pointer;user-select:none;white-space:nowrap;border-bottom:1px solid var(--line)}
thead th:hover{background:#E7F0FA}
tbody td{padding:9px 14px;border-bottom:1px solid #EEF2F7;color:var(--ink)}
tbody tr:hover{background:#F7FAFE}
.lpill{font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.3px;color:#fff}
.lpill.experience{background:var(--exp)} .lpill.process{background:var(--proc)}
.lpill.system{background:var(--sys)} .lpill.other{background:var(--oth)}
.st{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.st .dot{width:8px;height:8px;border-radius:50%}
.st.RUNNING .dot{background:var(--ok)} .st.RUNNING{color:var(--ok-tx)}
.st.STARTED .dot{background:var(--ok)} .st.STARTED{color:var(--ok-tx)}
.st.NOT_RUNNING .dot{background:var(--warn)} .st.NOT_RUNNING{color:var(--warn-tx)}
.st.UNDEPLOYED .dot{background:#ADB5BD} .st.UNDEPLOYED{color:#6C757D}
.st.SCALING .dot{background:var(--ok)} .st.SCALING{color:var(--ok-tx)}
.etag{font-size:10px;font-weight:700;padding:1px 7px;border-radius:6px}

/* ── Backend cards ──────────────────────────────────── */
.sys-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
.sys{background:var(--card);border-radius:13px;box-shadow:var(--shadow);padding:15px 16px;display:flex;gap:13px;align-items:flex-start}
.sys .ic{width:44px;height:44px;border-radius:11px;background:var(--band);display:flex;align-items:center;justify-content:center;flex:0 0 auto;border:1px solid var(--line)}
.sys .ic svg{width:26px;height:26px}
.sys .ic img{width:28px;height:28px;object-fit:contain}
.sys .nm{font-size:13.5px;font-weight:700;color:var(--title);line-height:1.2}
.sys .cat{font-size:11px;color:var(--muted);margin-top:2px;font-weight:600}
.sys .conns{font-size:11px;color:var(--val);margin-top:7px;font-weight:700}

/* ── Business Groups ────────────────────────────────── */
.bg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:24px}
.bg-card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px}
.bg-card .bg-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.bg-card .bg-name{font-size:13.5px;font-weight:700;color:var(--title);line-height:1.2;max-width:160px}
.bg-card .bg-pills{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.bg-pill{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.3px}
.bg-pill.prod{background:var(--val);color:#fff}
.bg-pill.sandbox{background:var(--band);color:var(--muted);border:1px solid var(--line)}
.bg-stat{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px;color:var(--ink)}
.bg-stat .bgs-lbl{color:var(--muted);font-weight:600}
.bg-stat .bgs-val{font-weight:700}
.bg-health{height:8px;border-radius:5px;background:#EDF1F6;overflow:hidden;margin-bottom:12px}
.bg-health .bgh-run{height:100%;background:var(--ok);border-radius:5px}
.bg-layers{height:8px;border-radius:5px;overflow:hidden;display:flex;margin-top:4px}
.bg-layers .bgl-exp{background:var(--exp)}
.bg-layers .bgl-proc{background:var(--proc)}
.bg-layers .bgl-sys{background:var(--sys)}
.bg-layers .bgl-other{background:#C0C8D2}
.bg-layer-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);margin-top:6px;font-weight:600}
.bg-layer-legend span{display:flex;align-items:center;gap:4px}

/* ── Insights ───────────────────────────────────────── */
.insight-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:26px}
.ins{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:20px}
.ins h3{margin:0 0 6px;font-size:14px;color:var(--title);font-weight:700;display:flex;gap:9px;align-items:center}
.ins h3 .ib{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ins h3 .ib svg{width:18px;height:18px}
.ins p{font-size:12.5px;color:var(--text);margin:8px 0 0}
.ins .big{font-size:26px;font-weight:800;color:var(--title)}
.reuse-row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:12.5px}
.reuse-row .rn{flex:1;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reuse-row .rbar{height:8px;border-radius:5px;background:#EDF1F6;flex:0 0 130px;overflow:hidden}
.reuse-row .rbar i{display:block;height:100%;background:var(--reuse2)}
.reuse-row .rv{font-weight:800;color:var(--title);width:26px;text-align:right}
.rec{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid #EEF2F7}
.rec:last-child{border-bottom:0}
.rec .rk{width:26px;height:26px;border-radius:7px;background:var(--band);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--title);font-weight:800;font-size:13px}
.rec .rt{font-size:12.5px} .rec .rt b{color:var(--title)}
footer{text-align:center;font-size:11px;color:var(--muted);padding:24px;border-top:1px solid var(--line);margin-top:20px}
.clientlist{display:flex;flex-direction:column;gap:8px}
.clientlist .ca{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--band);padding:8px 12px;border-radius:8px}
.clientlist .ca svg{width:15px;height:15px;color:var(--muted);flex:0 0 auto}
</style>
</head>
<body>
<header>

const dico = svg => `<div class="ic">${svg.replace('class="tico" ','')}</div>`;

function renderBgCard(bg){
  const healthPct = bg.total ? Math.round(bg.running/bg.total*100) : 0;
  const apiTotal  = bg.experience + bg.process + bg.system + bg.other;
  const pExp   = apiTotal ? Math.round(bg.experience/apiTotal*100) : 0;
  const pProc  = apiTotal ? Math.round(bg.process/apiTotal*100)    : 0;
  const pSys   = apiTotal ? Math.round(bg.system/apiTotal*100)     : 0;
  const pOther = Math.max(0, 100 - pExp - pProc - pSys);
  const prodPill    = bg.prod    > 0 ? '<span class="bg-pill prod">'    + bg.prod    + ' prod</span>'    : '';
  const sandboxPill = bg.sandbox > 0 ? '<span class="bg-pill sandbox">' + bg.sandbox + ' sandbox</span>': '';
  return '<div class="bg-card">'
    + '<div class="bg-head">'
    +   '<div class="bg-name">' + esc(bg.name) + '</div>'
    +   '<div class="bg-pills">' + prodPill + sandboxPill + '</div>'
    + '</div>'
    + '<div class="bg-stat"><span class="bgs-lbl">Applications</span><span class="bgs-val">' + bg.running + ' running / ' + bg.total + ' total</span></div>'
    + '<div class="bg-health"><div class="bgh-run" style="width:' + healthPct + '%"></div></div>'
    + '<div class="bg-stat" style="margin-top:10px"><span class="bgs-lbl">API-Led layers</span>'
    +   '<span class="bgs-val" style="font-size:11px;color:var(--muted)">Exp ' + bg.experience + ' · Proc ' + bg.process + ' · Sys ' + bg.system + '</span></div>'
    + '<div class="bg-layers">'
    +   '<div class="bgl-exp"   style="width:' + pExp   + '%"></div>'
    +   '<div class="bgl-proc"  style="width:' + pProc  + '%"></div>'
    +   '<div class="bgl-sys"   style="width:' + pSys   + '%"></div>'
    +   '<div class="bgl-other" style="width:' + pOther + '%"></div>'
    + '</div>'
    + '<div class="bg-layer-legend">'
    +   '<span><span class="dot" style="background:var(--exp);border-radius:2px"></span>Experience</span>'
    +   '<span><span class="dot" style="background:var(--proc);border-radius:2px"></span>Process</span>'
    +   '<span><span class="dot" style="background:var(--sys);border-radius:2px"></span>System</span>'
    + '</div>'
    + '</div>';
}

      ${DATA.backends.map(b=>`<div class="node-ico"><div class="disc">${icon(b.icon)}</div><div class="cap">${esc(b.label)}</div></div>`).join('')}

      <span><span style="display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--ord2);color:#fff;font-size:10px;font-weight:800;flex:0 0 auto">&#8601;2</span>&thinsp;= called by 2 integration/batch apps</span>
    </div>
  </div>
  ${renderIntegrationLadder()}`;

/* Integration & Batch apps (the "other" layer): their own lane feeding the backends
   they reach. Nothing calls these apps (batch jobs, schedulers, event subscribers),
   so there is no consumer row. A badge counts the Mule APIs each one invokes. */
function renderIntegrationLadder(){
  const otherApps = DATA.layerOther || [];
  if(!otherApps.length) return '';
  const byLabel = {}; DATA.nodes.forEach(n => byLabel[n.label] = n);
  const labels = new Set(otherApps.map(n => n.label));
  const reached = new Set(), apiCalls = {};
  DATA.edges.forEach(e => {
    if(!labels.has(e.source)) return;
    const t = byLabel[e.target]; if(!t) return;
    if(t.kind === 'backend') reached.add(e.target);
    else if(t.kind === 'mule') apiCalls[e.source] = (apiCalls[e.source]||0) + 1;
  });
  const backendNodes = DATA.backends.filter(b => reached.has(b.label));
  const totalCalls = Object.values(apiCalls).reduce((a,b)=>a+b, 0);
  const cards = otherApps.map(n => { const c = apiCalls[n.label] || 0; return `<div class="api">
      <div class="mi">${icon('mule')}</div>
      <div class="txt"><div class="nm">${esc(n.label)}</div>${n.tag?`<span class="dtag">${esc(n.tag)}</span>`:''}</div>
      ${c>0?`<div class="badges"><div class="badge calls" title="Invokes ${c} Mule API${c>1?'s':''}">&#8599;${c}</div></div>`:''}
    </div>`; }).join('');
  return `
  <div class="block" style="margin-top:26px">
    <h2 class="sec">Integration &amp; Batch Applications</h2>
    <p class="sec-desc">${otherApps.length} Mule application${otherApps.length===1?'':'s'} outside the API-led request path: batch jobs, scheduled integrations and event subscribers. Nothing calls them; they start work themselves and reach the backends below${totalCalls?`, calling Mule APIs ${totalCalls} time${totalCalls===1?'':'s'} along the way`:''}.</p>
  </div>
  <div class="arch">
    <div class="lane other">
      <div class="side">Integration<small>batch &amp; events · ${otherApps.length}</small></div>
      <div class="band">${cards}</div>
    </div>
    <div class="conn"></div>
    <div class="tier-row">
      ${backendNodes.length ? backendNodes.map(b=>`<div class="node-ico"><div class="disc">${icon(b.icon)}</div><div class="cap">${esc(b.label)}</div></div>`).join('') : '<span style="font-size:12px;color:var(--muted)">No backend connections observed.</span>'}
    </div>
    <div class="archnote">
      <span><span style="display:inline-flex;width:18px;height:18px;flex:0 0 auto">${MULE_SVG}</span> Integration / batch app</span>
      <span><span style="display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--sys);color:#fff;font-size:10px;font-weight:800;flex:0 0 auto">&#8599;2</span>&thinsp;= invokes 2 Mule APIs</span>
    </div>
  </div>`;
}

  // so reports built with an older builder still render.

    </div>`);
  if(dc){

  if(ph && (ph.replicaKnown || ph.runtimeKnown || ph.testAppsInProd.length)){

        .map(([n,v,t])=>`<div class="reuse-row" title="${t}"><span class="rn">${n}</span><span class="rbar"><i style="width:${Math.min(v,100)}%"></i></span><span class="rv" style="width:auto;min-width:44px">${v}%</span></div>`).join('')}

  return `

    </div>
    <div class="ins">
      <h3><span class="ib" style="background:var(--ok-bg)"><svg viewBox="0 0 24 24" fill="none" stroke="var(--ok-tx)" stroke-width="2"><path d="M12 22c5.5 0 10-4.5 10-10S17.5 2 12 2 2 6.5 2 12s4.5 10 10 10z"/><path d="M8 12l3 3 5-5"/></svg></span>Operational Health</h3>
      <div class="big">${healthPct}%</div>
      <p>${K.running} of ${K.totalApps} applications are running. ${(()=>{
        const pr = (DATA.envRows||[]).filter(r=>r.type==='production');
        const pt = pr.reduce((a,r)=>a+r.total,0), prun = pr.reduce((a,r)=>a+r.running,0);
        if(!pt) return '';
        const ps = pt - prun, lower = K.stopped - ps;
        if(ps === 0) return `Production is fully healthy (${prun} of ${pt} running)` + (K.stopped ? `; all ${K.stopped} stopped apps are in lower environments.` : '.');

      <div class="big">${DATA.clientApps.length}</div>

  <div class="cols">

      ${DATA.reuse.slice(0,8).map(n=>{

    <div class="card">

        ...(dc && dc.isolated > 0 ? [[`Triage isolated production apps`, `${dc.isolated} of ${dc.prodTotal} production apps have no mapped dependencies. Retire, document or connect them.`]] : []),
        [`Consolidate stopped apps`, K.stopped === 0 ? `All applications actively deployed. Your environment reflects strong operational governance and efficient resource allocation.` : (()=>{ const top = [...(DATA.envRows||[])].filter(r=>r.stopped>0).sort((x,y)=>y.stopped-x.stopped)[0];
          return `${K.stopped} deployment${K.stopped===1?' is':'s are'} stopped or undeployed` + (top ? `, most in ${esc(top.name)} (${top.stopped})` : '') + `. Remove the ones no longer needed to simplify governance.`; })()],
        [`Promote System-API reuse`, `Top reused System APIs: ${DATA.reuse.filter(n=>n.layer==='system').slice(0,3).map(n=>n.label).join(', ')||'N/A'}. Catalog them in Anypoint Exchange as canonical connectivity assets.`],
        ...((()=>{
          const ph = DATA.platformHealth; if(!ph || !ph.vcoreSizes.length) return [];
          const tot = ph.vcoreSizes.reduce((a,v)=>a+v.apps,0);
          const mix = ph.vcoreSizes.map(v=>`${v.apps} at ${v.size} vCore`).join(', ');
          const small = ph.vcoreSizes.filter(v=>v.size<=0.1).reduce((a,v)=>a+v.apps,0);
          const big = ph.vcoreSizes.filter(v=>v.size>=1);
          return [[`Right-size vCore allocation`, `Running production apps: ${mix}.` +
            (small/tot >= 0.5 ? ` Most run at the smallest size; check that it covers peak load for the busiest and data-heavy APIs.` : '') +
            (big.length ? ` Review whether the ${big.reduce((a,v)=>a+v.apps,0)} app${big.reduce((a,v)=>a+v.apps,0)===1?'':'s'} at 1 vCore or more need that capacity all the time.` : '')]];
        })()),
        ...(ph && ph.singleReplicaBusy.length ? [[`Add a second replica to shared APIs`, `${ph.singleReplicaBusy.length} production API${ph.singleReplicaBusy.length===1?' is':'s are'} used by 3 or more consumers but run${ph.singleReplicaBusy.length===1?'s':''} on one replica, led by ${esc(ph.singleReplicaBusy[0].name)} (${ph.singleReplicaBusy[0].consumers} consumers). Two replicas keep them available during worker restarts and failures.`]] : []),
        ...(ph && ph.java8.length ? [[`Move the Java 8 apps to Java 17`, `${ph.java8.length} production app${ph.java8.length===1?'':'s'} still run${ph.java8.length===1?'s':''} on Java 8. Mule 4 runtimes are moving to Java 17, so plan these with the next runtime upgrade.`]] : []),
        ...(ph && ph.testAppsInProd.length ? [[`Remove test apps from production`, `${ph.testAppsInProd.map(esc).join(', ')} ${ph.testAppsInProd.length===1?'looks':'look'} like test or proof-of-concept deployments.`]] : []),
        [`Formalize the Experience proxy pattern`, `Standardize proxy Experience APIs with API Manager policies for consistent security, throttling, and SLA enforcement across all consumer-facing channels.`],
      ].map(([t,d],i)=>`
        <div class="rec">
          <div class="rk">${i+1}</div>
          <div class="rt"><b>${t}.</b> ${d}</div>

    </div>
  </div>`;
}

/* ─── STATIC: graph builder ─────────────────────────────────────────────── */
/* Shorten a name only when it's worth it: an ellipsis must save at least MIN_SAVE
   characters, otherwise the full name is shown (dropping 2 chars for "…" helps nobody).
   mode 'middle' keeps the end (e.g. -v1/-v2); 'end' keeps the start. */
const MIN_SAVE = 6;
function shortName(t, max, mode){
  if(t.length - max < MIN_SAVE) return t;                      // not worth shortening
  if(mode === 'end') return t.slice(0, max - 1) + '…';
  const tail = Math.ceil((max - 1) * 0.4), head = max - 1 - tail;
  return t.slice(0, head) + '…' + t.slice(-tail);
}

let _graphFilter = 'all', _graphSearch = '', _graphFocus = null, _graphZoom = null, _graphView = 'columns';
const ZOOM_MIN = 0.3, ZOOM_MAX = 2.5;

/* Hierarchical edge bundling, circular layout.
   Nodes sit on a ring grouped into layer arcs (Consumer → Experience → Process →
   System → Backend). Each edge is routed through its layers' "hub" points between
   the ring and the centre, then bundled toward the straight chord (β), so flows
   between the same two layers draw as one smooth bundle. Same data, same classes
   (.gnode / .gedge) as the column view, so click-to-pin, filter and search all work. */
function layoutCircular(visibleNodes, byCol, COL_ORDER, COL_COLOR, visibleEdges){
  const ARC_COL = {consumer:'#052D60', experience:'#1E64B0', process:'#0BA49B', system:'#5E66F9', backend:'#7B8794'};
  const groups = COL_ORDER.map(c => ({col:c, nodes:[...byCol[c]].sort((a,b)=>a.label.localeCompare(b.label))}))
                          .filter(g => g.nodes.length);
  const N = groups.reduce((t,g)=>t+g.nodes.length, 0) || 1;
  // Labels: drop a prefix most Mule apps share (e.g. "pro-whs-") and shorten long names in
  // the middle so version suffixes (-v1/-v2) stay visible. The full name shows on hover.
  const F = 14;                                               // label font size (viewBox units)
  const mule = visibleNodes.filter(n => n.kind === 'mule'), pc = {};
  mule.forEach(n => { const m = n.label.match(/^([^-]+-[^-]+-)/); if(m) pc[m[1]] = (pc[m[1]]||0) + 1; });
  const topPfx = Object.entries(pc).sort((a,b) => b[1]-a[1])[0];
  const PREFIX = (topPfx && mule.length >= 5 && topPfx[1] >= 0.6*mule.length) ? topPfx[0] : '';
  const MAXC = 30;
  const disp = n => {
    const t = (PREFIX && n.kind === 'mule' && n.label.startsWith(PREFIX)) ? n.label.slice(PREFIX.length) : n.label;
    return shortName(t, MAXC, 'middle');
  };
  const textW = t => 0.56 * F * t.length;                     // width estimate, semibold sans
  const GAP = 0.07;                                           // radians between layer arcs
  const step = (2*Math.PI - GAP*groups.length) / N;
  // Ring just big enough for 1.25 × the font height between neighbouring labels; label
  // space sized to the longest label, so the fitted view shows text as large as possible.
  const R = Math.max(200, Math.min(620, 1.25 * F / step));
  const LR = R + 27;                                          // labels start outside the layer arc
  const LBL = 27 + 8 + Math.max(60, ...visibleNodes.map(n => textW(disp(n))));
  const M = 44;                                               // outer margin (layer names)
  const W = 2*(R+LBL+M), H = W, cx = W/2, cy = H/2;
  const ang = {}, hub = {};
  let a = -Math.PI/2 + GAP/2;                                 // start at 12 o'clock
  groups.forEach(g => {
    const a0 = a;
    g.nodes.forEach(n => { ang[n.key] = a + step/2; a += step; });
    g.a0 = a0; g.a1 = a; a += GAP;
    const mid = (g.a0+g.a1)/2;
    hub[g.col] = [cx + R*0.42*Math.cos(mid), cy + R*0.42*Math.sin(mid)];
  });
  const colOf = {};
  groups.forEach(g => g.nodes.forEach(n => colOf[n.key] = g.col));
  const pt = (k, r) => [cx + r*Math.cos(ang[k]), cy + r*Math.sin(ang[k])];
  const arcPath = (r, a0, a1) => {
    const [x0,y0] = [cx+r*Math.cos(a0), cy+r*Math.sin(a0)], [x1,y1] = [cx+r*Math.cos(a1), cy+r*Math.sin(a1)];
    return `M${x0},${y0} A${r},${r} 0 ${a1-a0>Math.PI?1:0} 1 ${x1},${y1}`;
  };
  // Uniform Catmull-Rom → cubic Bézier through the given control points
  const spline = P => {
    let d = `M${P[0][0].toFixed(1)},${P[0][1].toFixed(1)}`;
    for(let i=0;i<P.length-1;i++){
      const p0=P[Math.max(0,i-1)], p1=P[i], p2=P[i+1], p3=P[Math.min(P.length-1,i+2)];
      const c1=[p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6], c2=[p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];
      d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }
    return d;
  };
  const BETA = 0.85, RN = R - 10;                            // bundling strength; edge end radius (inside the dots)
  let html = '';
  // layer arcs + labels
  groups.forEach(g => {
    html += `<path d="${arcPath(R+16, g.a0, g.a1)}" fill="none" stroke="${ARC_COL[g.col]}" stroke-width="7" stroke-linecap="round"/>`;
    // Layer name just beyond the longest label, anchored away from the circle so it never
    // sits on top of the labels; clamped inside the canvas.
    const mid = (g.a0+g.a1)/2, lr = R + LBL + 22, name = `${g.col.toUpperCase()} (${g.nodes.length})`;
    const cs = Math.cos(mid), sn = Math.sin(mid), gw = 0.68 * 15 * name.length;
    const anchor = cs > 0.3 ? 'start' : cs < -0.3 ? 'end' : 'middle';
    let lx = cx + lr*cs, ly = cy + lr*sn + (anchor === 'middle' ? (sn < 0 ? -6 : 10) : 0);
    lx = anchor === 'start' ? Math.min(lx, W - gw - 6) : anchor === 'end' ? Math.max(lx, gw + 6) : Math.min(W - gw/2 - 6, Math.max(gw/2 + 6, lx));
    ly = Math.min(H - 10, Math.max(14, ly));
    html += `<text x="${lx}" y="${ly}" text-anchor="${anchor}" dominant-baseline="middle" font-size="15" font-weight="700" fill="#5F6B78" letter-spacing="0.8">${name}</text>`;
  });
  // edges (bundled splines)
  visibleEdges.forEach(e => {
    const s = DATA.nodes.find(n=>n.label===e.source), t = DATA.nodes.find(n=>n.label===e.target);
    if(!s || !t || ang[s.key]===undefined || ang[t.key]===undefined) return;
    const P0 = pt(s.key, RN), P3 = pt(t.key, RN);
    const raw = [P0];
    if(colOf[s.key] === colOf[t.key]) raw.push(hub[colOf[s.key]]);
    else { raw.push(hub[colOf[s.key]]); raw.push([cx, cy]); raw.push(hub[colOf[t.key]]); }
    raw.push(P3);
    const L = raw.length - 1;
    const P = raw.map((p,i) => (i===0||i===L) ? p :
      [BETA*p[0] + (1-BETA)*(P0[0] + (P3[0]-P0[0])*i/L), BETA*p[1] + (1-BETA)*(P0[1] + (P3[1]-P0[1])*i/L)]);
    html += `<path class="gedge circ" marker-end="url(#a-base)" data-bm="url(#a-base)" data-s="${esc(s.key)}" data-t="${esc(t.key)}" d="${spline(P)}"/>`;
  });
  // nodes: a dot on the ring + a radial label (flipped on the left half so it reads left-to-right)
  visibleNodes.forEach(n => {
    if(ang[n.key] === undefined) return;
    const A = ang[n.key], col = colOf[n.key], deg = A*180/Math.PI;
    const [dx,dy] = pt(n.key, R), flip = Math.cos(A) < 0;
    const [tx,ty] = pt(n.key, LR);
    const lbl = disp(n);
    // Invisible hit area from just inside the dot to the end of the label, as tall as the
    // gap to the neighbouring node at the ring, so the name is clickable and never overlaps.
    const hitH = Math.max(8, Math.min(24, step*R - 1)), hitL = (LR - R) + textW(lbl) + 8;
    html += `<g class="gnode circ" data-key="${esc(n.key)}" data-label="${esc(n.label)}" data-layer="${esc(n.layer||col)}" data-in="${n.in||0}" data-out="${n.out||0}" data-tag="${esc(n.tag||'')}">
      <rect class="ghit" x="-10" y="${-hitH/2}" width="${hitL+10}" height="${hitH}" rx="4" transform="translate(${dx},${dy}) rotate(${deg})"/>
      <circle class="gdot" cx="${dx}" cy="${dy}" r="5" fill="${COL_COLOR[col]||'#7B8794'}"/>
      <text class="glabel" style="font-size:${F}px" transform="translate(${tx},${ty}) rotate(${flip?deg+180:deg})" text-anchor="${flip?'end':'start'}" dominant-baseline="middle">${esc(lbl)}</text>
    </g>`;
  });
  if(PREFIX) html += `<text x="16" y="${H - 14}" font-size="14" fill="#5F6B78">Names shown without the shared prefix “${esc(PREFIX)}”. Hover a node for its full name.</text>`;
  return {html, w: W, h: H};
}

function buildGraph(){
  const svg = document.getElementById('flowsvg');
  if(!svg) return;
  const tip = document.getElementById('flowtip');
  const countEl = document.getElementById('flowCount');

  const COL_COLOR = {consumer:'#052D60', experience:'#1E64B0', process:'#0BA49B', system:'#5E66F9', backend:'#7B8794'};
  const COL_ORDER = ['consumer','experience','process','system','backend'];
  const NW=210, NH=32, HGAP=72, VGAP=10, PAD=36, HEADER=32;

  // Filter visible nodes by active layer + search
  const q = _graphSearch.toLowerCase();
  const visibleKeys = new Set();
  DATA.nodes.forEach(n => {
    const col = n.kind==='consumer'?'consumer': n.kind==='backend'?'backend': n.layer||'experience';
    const layerMatch = _graphFilter==='all' || col===_graphFilter || n.kind==='consumer' || n.kind==='backend';
    const searchMatch = !q || n.label.toLowerCase().includes(q);
    if(layerMatch && searchMatch) visibleKeys.add(n.key);
  });

  // Only include edges where BOTH endpoints are visible
  const visibleEdges = DATA.edges.filter(e => {
    const s = DATA.nodes.find(n=>n.label===e.source);
    const t = DATA.nodes.find(n=>n.label===e.target);
    return s && t && visibleKeys.has(s.key) && visibleKeys.has(t.key);
  });

  // Also include nodes that are connected to a visible node via an edge (keep context)
  if(q || _graphFilter!=='all'){
    visibleEdges.forEach(e => {
      const s = DATA.nodes.find(n=>n.label===e.source);
      const t = DATA.nodes.find(n=>n.label===e.target);
      if(s) visibleKeys.add(s.key);
      if(t) visibleKeys.add(t.key);
    });
  }

  const visibleNodes = DATA.nodes.filter(n => visibleKeys.has(n.key));

  const byCol = {};
  COL_ORDER.forEach(c => byCol[c]=[]);
  visibleNodes.forEach(n => {
    const col = n.kind==='consumer'?'consumer': n.kind==='backend'?'backend': n.layer||'experience';
    (byCol[col]||byCol['backend']).push(n);
  });

  // Arrowhead markers. context-stroke isn't supported everywhere, so one marker per state.
  let html = `<defs>${[['a-base','#B7C6D9'],['a-out','#1B2733'],['a-in','#C2255C']].map(([id,c]) =>
    `<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">` +
    `<path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker>`).join('')}</defs>`;
  let totalW, totalH;

  if(_graphView === 'circular'){
    const c = layoutCircular(visibleNodes, byCol, COL_ORDER, COL_COLOR, visibleEdges);
    html += c.html; totalW = c.w; totalH = c.h;
  } else {
    const maxRows = Math.max(...COL_ORDER.map(c=>byCol[c].length), 1);
    totalW = COL_ORDER.length*(NW+HGAP) - HGAP + PAD*2;
    totalH = maxRows*(NH+VGAP) - VGAP + PAD*2 + HEADER;

    const pos = {};
    COL_ORDER.forEach((col,ci) => {
      const x = PAD + ci*(NW+HGAP);
      byCol[col].forEach((n,ri) => {
        pos[n.key] = {x, y: HEADER + PAD + ri*(NH+VGAP), col};
      });
    });

    // column headers
    COL_ORDER.forEach((col,ci) => {
      const x = PAD + ci*(NW+HGAP);
      const count = byCol[col].length;
      if(!count) return;
      html += `<text x="${x+NW/2}" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#7B8794" letter-spacing="0.6">${col.toUpperCase()} (${count})</text>`;
    });

    // edges
    visibleEdges.forEach(e => {
      const s = DATA.nodes.find(n=>n.label===e.source);
      const t = DATA.nodes.find(n=>n.label===e.target);
      if(!s||!t||!pos[s.key]||!pos[t.key]) return;
      const p1=pos[s.key], p2=pos[t.key];
      let d;
      if(p1.x < p2.x){
        // normal left-to-right: source's right edge -> target's left edge
        const x1=p1.x+NW, y1=p1.y+NH/2, x2=p2.x-2, y2=p2.y+NH/2, cx=(x1+x2)/2;
        d = `M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2}`;
      } else if(p1.x > p2.x){
        // backwards (e.g. a System API calling a Process API): leave left, arrive on the right
        const x1=p1.x, y1=p1.y+NH/2, x2=p2.x+NW+2, y2=p2.y+NH/2, cx=(x1+x2)/2;
        d = `M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2}`;
      } else {
        // same column: loop out to the right so the arrow stays visible
        const x1=p1.x+NW, y1=p1.y+NH/2, x2=p2.x+NW+2, y2=p2.y+NH/2, bx=p1.x+NW+HGAP*0.6;
        d = `M${x1},${y1} C${bx},${y1} ${bx},${y2} ${x2},${y2}`;
      }
      html += `<path class="gedge" marker-end="url(#a-base)" data-bm="url(#a-base)" data-s="${esc(s.key)}" data-t="${esc(t.key)}" d="${d}"/>`;
    });

    // nodes
    visibleNodes.forEach(n => {
      const p = pos[n.key];
      if(!p) return;
      const color = COL_COLOR[p.col]||'#7B8794';
      const lbl = shortName(n.label, 26, 'end');
      html += `<g class="gnode" data-key="${esc(n.key)}" data-label="${esc(n.label)}" data-layer="${esc(n.layer||p.col)}" data-in="${n.in||0}" data-out="${n.out||0}" data-tag="${esc(n.tag||'')}">
        <rect class="gcard" x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="6"/>
        <rect x="${p.x}" y="${p.y}" width="5" height="${NH}" rx="3" fill="${color}"/>
        <text class="glabel" x="${p.x+17}" y="${p.y+NH/2+4.5}" font-size="11.5">${esc(lbl)}</text>
      </g>`;
    });
  }

  // Natural size in viewBox units; the on-screen size is natural × zoom.
  // First render: columns fit the width; the circle fits the whole canvas. Never above 100%.
  svg.setAttribute('viewBox',`0 0 ${totalW} ${totalH}`);
  svg.dataset.w = totalW; svg.dataset.h = totalH;
  const scroller = svg.parentElement;
  if(_graphZoom === null){
    const aw = (scroller.clientWidth || totalW) - 4, ah = (scroller.clientHeight || totalH) - 4;
    const fit = _graphView === 'circular' ? Math.min(aw/totalW, ah/totalH) : aw/totalW;
    _graphZoom = Math.max(ZOOM_MIN, Math.min(1, fit));
  }
  applyZoom(_graphZoom);

  svg.innerHTML = html;
  if(countEl) countEl.textContent = `${visibleNodes.length} nodes · ${visibleEdges.length} edges`;

  // interactions — click a tile to pin its connections; click a highlighted
  // neighbour to walk the graph; click it again, empty space, or Esc to clear.
  // Hover only shows the tooltip.
  function hideTip(){ tip.style.opacity=0; }
  function focusNode(key){
    _graphFocus = key;
    svg.querySelectorAll('.gnode.sel').forEach(n => n.classList.remove('sel'));
    if(!key){
      svg.classList.remove('dim');
      svg.querySelectorAll('.hl').forEach(e=>e.classList.remove('hl'));
      svg.querySelectorAll('.gedge').forEach(e => { e.classList.remove('out','in'); e.setAttribute('marker-end', e.dataset.bm || 'url(#a-base)'); });
      return;
    }
    svg.classList.add('dim');
    const connKeys = new Set([key]);
    svg.querySelectorAll('.gedge').forEach(e => {
      const out = e.dataset.s===key, inn = e.dataset.t===key;
      e.classList.toggle('out', out); e.classList.toggle('in', inn);
      e.setAttribute('marker-end', out ? 'url(#a-out)' : inn ? 'url(#a-in)' : (e.dataset.bm || 'url(#a-base)'));
      if(out || inn){ connKeys.add(e.dataset.s); connKeys.add(e.dataset.t); }
    });
    svg.querySelectorAll('.gnode').forEach(n => {
      n.classList.toggle('hl', connKeys.has(n.dataset.key));
      n.classList.toggle('sel', n.dataset.key===key);
    });
  }
  svg.addEventListener('mouseleave', hideTip);
  svg.addEventListener('click', ev => { if(!ev.target.closest('.gnode')) focusNode(null); });
  svg.querySelectorAll('.gnode').forEach(g => {
    g.addEventListener('click', ev => {
      ev.stopPropagation();
      focusNode(_graphFocus===g.dataset.key ? null : g.dataset.key);
    });
    g.addEventListener('mouseenter', ev => {
      tip.innerHTML = `<b>${esc(g.dataset.label)}</b><br>${g.dataset.layer}${g.dataset.tag?' · '+esc(g.dataset.tag):''}<br>In: ${g.dataset.in} · Out: ${g.dataset.out}<br><span style="opacity:.75">Click to ${_graphFocus===g.dataset.key?'clear':'show connections'}</span>`;
      tip.style.opacity=1; tip.style.left=(ev.clientX+14)+'px'; tip.style.top=(ev.clientY-10)+'px';
    });
    g.addEventListener('mousemove', ev => { tip.style.left=(ev.clientX+14)+'px'; tip.style.top=(ev.clientY-10)+'px'; });
    g.addEventListener('mouseleave', hideTip);
  });
  if(!document.body.dataset.flowEsc){
    document.body.dataset.flowEsc = '1';
    document.addEventListener('keydown', ev => {
      if(ev.key==='Escape' && document.getElementById('flowsvg')){ _graphFocus = null; buildGraph(); }
    });
  }
  // keep the pinned selection across filter / search rebuilds (if still visible);
  // otherwise make sure the graph isn't left dimmed by a previous selection
  if(_graphFocus && visibleNodes.some(n => n.key===_graphFocus)) focusNode(_graphFocus);
  else focusNode(null);

  // filter + search wiring (runs once per renderFlows)
  document.querySelectorAll('.vbtn').forEach(btn => {
    if(btn.dataset.wired) return; btn.dataset.wired = '1';
    btn.addEventListener('click', () => {
      if(_graphView === btn.dataset.view) return;
      _graphView = btn.dataset.view; _graphZoom = null;      // re-fit for the new layout
      document.querySelectorAll('.vbtn').forEach(b => b.classList.toggle('active', b===btn));
      buildGraph();
    });
  });
  document.querySelectorAll('.filt').forEach(btn => {
    btn.addEventListener('click', () => {
      _graphFilter = btn.dataset.layer;
      document.querySelectorAll('.filt').forEach(b => b.classList.toggle('active', b===btn));
      buildGraph();
    });
  });
  const searchEl = document.getElementById('flowSearch');
  if(searchEl && !searchEl.dataset.wired){
    searchEl.dataset.wired = '1';
    searchEl.addEventListener('input', () => { _graphSearch = searchEl.value; buildGraph(); });
  }
  wireZoom();
}

/* Zoom: scales the SVG's on-screen size; viewBox keeps it crisp. Zooming keeps the
   point under the cursor (wheel) or the centre of the view (buttons) in place. */
function applyZoom(z, anchor){
  const svg = document.getElementById('flowsvg');
  if(!svg) return;
  const sc = svg.parentElement;
  const old = _graphZoom || z;
  z = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, z));
  const ax = anchor ? anchor.x : sc.clientWidth / 2, ay = anchor ? anchor.y : sc.clientHeight / 2;
  const cx = (sc.scrollLeft + ax) / old, cy = (sc.scrollTop + ay) / old;
  _graphZoom = z;
  svg.setAttribute('width', Math.round(+svg.dataset.w * z));
  svg.setAttribute('height', Math.round(+svg.dataset.h * z));
  sc.scrollLeft = cx * z - ax; sc.scrollTop = cy * z - ay;
  const lvl = document.getElementById('zoomLvl');
  if(lvl) lvl.textContent = Math.round(z * 100) + '%';
}
function zoomFit(){
  const svg = document.getElementById('flowsvg');
  if(!svg) return;
  const sc = svg.parentElement;
  // columns: fit the width (tall columns scroll); circular: fit the whole ring
  const fw = (sc.clientWidth - 4) / +svg.dataset.w, fh = (sc.clientHeight - 4) / +svg.dataset.h;
  applyZoom(Math.min(_graphView === 'circular' ? Math.min(fw, fh) : fw, 1));
  sc.scrollLeft = 0; sc.scrollTop = 0;
}
function wireZoom(){
  const sc = document.querySelector('.graph-scroll');
  if(!sc || sc.dataset.zoomWired) return;
  sc.dataset.zoomWired = '1';
  const step = f => applyZoom(_graphZoom * f);
  document.getElementById('zoomIn').addEventListener('click', () => step(1.2));
  document.getElementById('zoomOut').addEventListener('click', () => step(1 / 1.2));
  document.getElementById('zoomReset').addEventListener('click', () => applyZoom(1));
  document.getElementById('zoomFit').addEventListener('click', zoomFit);
  // Ctrl/Cmd + wheel (and trackpad pinch) zooms around the cursor; a plain wheel scrolls.
  sc.addEventListener('wheel', ev => {
    if(!(ev.ctrlKey || ev.metaKey)) return;
    ev.preventDefault();
    const r = sc.getBoundingClientRect();
    applyZoom(_graphZoom * Math.exp(-ev.deltaY * 0.0015), {x: ev.clientX - r.left, y: ev.clientY - r.top});
  }, {passive:false});
  // Drag the background to pan. Tiles stay clickable.
  let drag = null;
  sc.addEventListener('mousedown', ev => {
    if(ev.button !== 0 || ev.target.closest('.gnode')) return;
    drag = {x: ev.clientX, y: ev.clientY, l: sc.scrollLeft, t: sc.scrollTop, moved: false};
    sc.classList.add('panning');
  });
  window.addEventListener('mousemove', ev => {
    if(!drag) return;
    const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if(Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    sc.scrollLeft = drag.l - dx; sc.scrollTop = drag.t - dy;
  });
  window.addEventListener('mouseup', () => {
    if(!drag) return;
    sc.classList.remove('panning');
    // a drag shouldn't count as a "click on empty space" that clears the selection
    if(drag.moved) sc.addEventListener('click', e => e.stopPropagation(), {capture:true, once:true});
    drag = null;
  });
}

  const pct = v => (v*100).toFixed(2) + '%';
  const idx = v => v.toFixed(2);
  const layerColor = l => l==='experience'?'var(--exp)':l==='process'?'var(--proc)':l==='system'?'var(--sys)':'var(--muted)';
  const layerLabel = l => l==='experience'?'Experience':l==='process'?'Process':l==='system'?'System':'—';

  // Maturity band from reuse rate
  const rr = ra.reuseRate;
  const maturity = rr >= 0.50 ? {label:'Mature API-Led',  color:'var(--reuse-tx)', bg:'#FBDCC4', bar:'var(--reuse1)', desc:'API-led operating at full scale. Assets are systematically shared and reused across the organisation as business-as-usual.'}
                : rr >= 0.40 ? {label:'Industrialised',   color:'var(--reuse-tx)', bg:'#FCE6D5', bar:'var(--reuse2)', desc:'API-led embedded in business-as-usual. Self-service production and consumption model is operationalised.'}
                : rr >= 0.20 ? {label:'Developing',        color:'var(--reuse-tx)', bg:'#FDEFE4', bar:'var(--reuse3)', desc:'API-led practices established in core programs. Reuse is growing but not yet systematic across the organisation.'}
                :              {label:'Incubating',         color:'var(--reuse-tx)', bg:'#FEF6F0', bar:'#F7C29C', desc:'API-led practices are in early stages. Most integrations are point-to-point with limited shared-asset reuse.'};

  // Benchmark reference values — avg derived from peer set in ANA Industry Data Matrix
  // (falls back to MuleSoft global average of 38% if matrix was unavailable at build time)
  const _benchmarkAvg = (DATA.reuseAnalysis || {}).benchmarkAvg;
  const BENCH_AVG = (_benchmarkAvg != null) ? _benchmarkAvg : 0.38;
  const BENCH_LOW = 0.10, BENCH_HIGH = 0.70;
  const barPct = Math.min(Math.round(rr * 100), 100);

  // Donut breakdown values
  const total = ra.apisTotal;
  const segments = [
    {label:'Multiple consumers', count:ra.consumedMore, color:'var(--reuse1)',   pctVal: ra.apisTotal ? ra.consumedMore/ra.apisTotal : 0},
    {label:'Single consumer',    count:ra.consumedOnce, color:'var(--reuse2)', pctVal: ra.apisTotal ? ra.consumedOnce/ra.apisTotal : 0},

  ];

  // SVG donut (simple arc segments)
  function donutSvg(segs, total){
    if(!total) return '';
    const R=54, cx=64, cy=64, strokeW=22;
    const circ = 2*Math.PI*R;
    let offset = 0;
    let arcs = segs.map(s => {
      const frac = s.count/total;
      const dash = frac*circ;
      const arc = `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${s.color}"
        stroke-width="${strokeW}" stroke-dasharray="${dash.toFixed(2)} ${(circ-dash).toFixed(2)}"
        stroke-dashoffset="${(-offset*circ).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`;
      offset += frac;
      return arc;
    }).join('');
    return `<svg viewBox="0 0 128 128" style="width:128px;height:128px;flex-shrink:0">${arcs}
      <text x="64" y="60" text-anchor="middle" font-size="19" font-weight="800" fill="var(--title)" font-family="inherit">${total}</text>

  return `
  <div class="block">

    <div class="kpi">

      <div style="font-size:11px;color:var(--muted);margin-top:4px">visible in Anypoint Visualizer</div>
    </div>
    <div class="kpi" style="background:${maturity.bg};border:1.5px solid ${maturity.color}20">
      <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Maturity Stage</div>
      <div style="font-size:20px;font-weight:800;color:${maturity.color};line-height:1.2">${maturity.label}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:4px">Target: Mature API-Led (50 %+)</div>
    </div>
  </div>

  <!-- ── Row 2: donut + breakdown table ── -->
  <div class="cols" style="margin-bottom:26px">

    <!-- Donut + legend + layer breakdown -->
    <div class="card">
      <h3 style="font-size:13px;font-weight:700;color:var(--title);margin:0 0 16px">${dico(TICO.reuse)} API Consumer Distribution</h3>
      <div style="display:flex;align-items:center;gap:22px;margin-bottom:20px">
        ${donutSvg(segments, total)}
        <div style="display:flex;flex-direction:column;gap:12px">
          ${segments.map(s => `
          <div>
            <div style="display:flex;align-items:center;gap:7px;margin-bottom:2px">
              <span style="width:10px;height:10px;border-radius:50%;background:${s.color};flex-shrink:0"></span>
              <span style="font-size:12.5px;font-weight:600;color:var(--title)">${s.count} <span style="font-weight:400;color:var(--muted)">(${pct(s.pctVal)})</span></span>
            </div>
            <div style="font-size:11px;color:var(--muted);padding-left:17px">${s.label}</div>
          </div>`).join('')}
        </div>
      </div>

      <!-- Reuse by layer stacked bars -->
      <div style="border-top:1px solid var(--line);padding-top:16px">
        <div style="font-size:12px;font-weight:600;color:var(--title);margin-bottom:10px">Reuse by API-Led Layer</div>
        ${(()=>{
          const byLayer = ra.byLayer || {};
          const layerDefs = [
            {key:'experience', label:'Experience', color:'var(--exp)'},
            {key:'process',    label:'Process',    color:'var(--proc)'},

          ].filter(d => byLayer[d.key] && byLayer[d.key].total > 0);

            return `
            <div style="margin-bottom:11px">
              <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
                <div style="display:flex;align-items:center;gap:6px">
                  <span style="width:8px;height:8px;border-radius:50%;background:${d.color};flex-shrink:0"></span>
                  <span style="font-size:12px;font-weight:600;color:var(--title)">${d.label}</span>
                  <span style="font-size:11px;color:var(--muted)">${s.total} API${s.total!==1?'s':''}</span>
                </div>
                <span style="font-size:11.5px;font-weight:700;color:var(--title)">${pct(s.reuseRate)} reuse</span>
              </div>
              <div style="display:flex;gap:2px;border-radius:99px;overflow:hidden;height:8px;background:var(--line)">
                ${moreW > 0 ? `<div style="width:${moreW}%;background:var(--reuse1)" title="${s.more} with 2+ consumers"></div>` : ''}
                ${onceW > 0 ? `<div style="width:${onceW}%;background:var(--reuse2)" title="${s.once} with 1 consumer"></div>` : ''}
                ${noneW > 0 ? `<div style="width:${noneW}%;background:var(--reuse3)" title="${s.none} with no consumers"></div>` : ''}
              </div>
            </div>`;
          }).join('');
        })()}
        <div style="display:flex;gap:14px;margin-top:10px">
          ${[['2+ consumers','var(--reuse1)'],['1 consumer','var(--reuse2)'],['No consumers','var(--reuse3)']].map(([l,c])=>`
          <div style="display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted)">
            <span style="width:8px;height:8px;border-radius:2px;background:${c};flex-shrink:0"></span>${l}
          </div>`).join('')}
        </div>
      </div>
    </div>

    <!-- Breakdown table -->
    <div class="card">
      <h3 style="font-size:13px;font-weight:700;color:var(--title);margin:0 0 14px">${dico(TICO.arch)} Breakdown</h3>
      <table style="width:100%;border-collapse:collapse;font-size:12.5px">
        <thead>
          <tr style="border-bottom:1.5px solid var(--line)">
            <th style="text-align:left;padding:6px 0;color:var(--muted);font-weight:600">Metric</th>
            <th style="text-align:right;padding:6px 0;color:var(--muted);font-weight:600">Value</th>
            <th style="text-align:left;padding:6px 8px;color:var(--muted);font-weight:600">Description</th>
          </tr>
        </thead>
        <tbody>
          ${[
            ['# APIs Total',                  ra.apisTotal,                     'Mule apps visible in Anypoint Visualizer (production)'],
            ['# APIs — 2+ consumers',          ra.consumedMore,                  'Actively reused shared-platform assets'],
            ['# APIs — 1 consumer',            ra.consumedOnce,                  'Point-to-point; review for reuse opportunity'],
            ['# APIs — no consumers',          ra.consumedNone,                  'Batch jobs, zombies, or not yet connected'],
            ['Total consumers',                ra.consumers,                     'Client apps + Mule-to-Mule connections (expanded)'],
            ['Reuse instances',                ra.reuseInstances,                'Consumers beyond the first per API'],
            ['Reuse rate',                     pct(ra.reuseRate),                '(consumers − APIs w/consumer) / consumers'],
            ['Reusability',                    pct(ra.reusability),              'APIs with 2+ consumers / total active APIs'],
            ['Reuse index (active APIs)',       idx(ra.reuseIndexApis),           'Avg consumers per API with at least 1 consumer'],
            ['Reuse index (all APIs)',          idx(ra.reuseIndexAll),            'Avg consumers across all visualizer APIs'],
          ].map((r,i) => `
          <tr style="border-bottom:1px solid var(--line);${i%2===0?'background:#FAFBFD':''}">
            <td style="padding:7px 0;font-weight:600;color:var(--title)">${r[0]}</td>
            <td style="padding:7px 0;text-align:right;font-weight:700;color:var(--title)">${r[1]}</td>
            <td style="padding:7px 8px;color:var(--muted);font-size:11.5px">${r[2]}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>

  <!-- ── Row 3: benchmark bar + BG drill-down ── -->
  <div class="cols" style="margin-bottom:26px">

    <!-- Benchmark bar -->
    <div class="card">
      <h3 style="font-size:13px;font-weight:700;color:var(--title);margin:0 0 18px">Reuse Rate vs MuleSoft Benchmark</h3>
      <div style="font-size:11px;color:var(--muted);margin-bottom:16px">${_benchmarkAvg != null ? 'Peer industry benchmark' : 'MuleSoft customer benchmark'}: low ${pct(BENCH_LOW)} · avg ${pct(BENCH_AVG)} · high ${pct(BENCH_HIGH)}</div>

      <!-- Customer bar -->
      <div style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;margin-bottom:5px">
          <span style="font-size:12px;font-weight:600;color:var(--title)">${esc(DATA.meta.customer)} Today</span>
          <span style="font-size:12px;font-weight:700;color:var(--title)">${pct(rr)}</span>
        </div>
        <div style="background:var(--line);border-radius:99px;height:10px;position:relative">
          <div style="height:10px;border-radius:99px;background:var(--reuse2);width:${barPct}%;transition:width .6s"></div>
        </div>
      </div>

      <!-- Benchmark avg bar -->
      <div style="margin-bottom:22px">
        <div style="display:flex;justify-content:space-between;margin-bottom:5px">
          <span style="font-size:12px;font-weight:600;color:var(--muted)">Benchmark avg</span>
          <span style="font-size:12px;font-weight:700;color:var(--muted)">${pct(BENCH_AVG)}</span>
        </div>
        <div style="background:var(--line);border-radius:99px;height:10px;position:relative">
          <div style="height:10px;border-radius:99px;background:var(--ord3);width:${benchAvgPct}%"></div>
        </div>
      </div>

      <!-- Maturity stages -->
      <div style="display:flex;gap:0;border-radius:8px;overflow:hidden;margin-bottom:10px">
        ${[{l:'Incubating',pct:'20%',c:'#FEF6F0',tc:'#A8350A'},{l:'Developing',pct:'40%',c:'#FDEFE4',tc:'#A8350A'},{l:'Industrialised',pct:'50%',c:'#FCE6D5',tc:'#A8350A'},{l:'Mature API-Led',pct:'50%+',c:'#FBDCC4',tc:'#A8350A'}].map(s=>`
        <div style="flex:1;padding:8px 6px;text-align:center;${s.l===maturity.label ? 'background:var(--reuse1);color:#fff' : `background:${s.c}`}">
          <div style="font-size:10px;font-weight:700;color:${s.l===maturity.label ? '#fff' : s.tc}">${s.l}${s.l===maturity.label ? ' ✓' : ''}</div>
          <div style="font-size:10px;color:${s.l===maturity.label ? '#FDE3D0' : 'var(--muted)'}">&lt;${s.pct}</div>
        </div>`).join('')}
      </div>

      <div style="margin-top:12px;padding:10px 12px;background:${maturity.bg};border-radius:8px;border-left:3px solid ${maturity.color}">
        <span style="font-size:11.5px;color:var(--text)">${maturity.desc}</span>
      </div>
    </div>

  ${/* ── By Business Group drill-down (right column of row 3) ── */ ''}
  ${(()=>{
    const bgs = (DATA.reuseAnalysis || {}).byBG || [];
    if(bgs.length <= 1) return '';   // only show if multiple BGs exist

    const maturityOf = r => r >= 0.50 ? {label:'Mature API-Led',color:'var(--reuse-tx)',bg:'#FBDCC4',bar:'var(--reuse1)'}
                          : r >= 0.40 ? {label:'Industrialised', color:'var(--reuse-tx)',bg:'#FCE6D5',bar:'var(--reuse2)'}
                          : r >= 0.20 ? {label:'Developing',     color:'var(--reuse-tx)',bg:'#FDEFE4',bar:'var(--reuse3)'}
                          :             {label:'Incubating',     color:'var(--reuse-tx)',bg:'#FEF6F0',bar:'#F7C29C'};

    const bgRows = bgs.map((bg, i) => {
      const m = maturityOf(bg.reuseRate);
      const barW = Math.round(bg.reuseRate * 100);
      const uid  = 'bg-drill-' + i;
      const maxC = bg.perApp.length ? bg.perApp[0].consumers : 1;

      const apiRows = bg.perApp.slice(0,8).map(a => {
        const w = Math.round(a.consumers / maxC * 100);
        const lc = layerColor(a.layer);
        return `<div style="margin:7px 0">
          <div style="display:flex;justify-content:space-between;margin-bottom:2px">
            <span style="font-size:11px;font-weight:600;color:var(--title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px" title="${esc(a.name)}">${esc(a.name)}</span>
            <span style="font-size:11px;color:var(--muted);flex-shrink:0;margin-left:6px">${a.consumers} consumer${a.consumers!==1?'s':''}</span>
          </div>
          <div style="background:var(--line);border-radius:99px;height:4px">
            <div style="height:4px;border-radius:99px;background:${lc};width:${w}%"></div>
          </div>
        </div>`;
      }).join('');

      const noApis = bg.perApp.length === 0
        ? `<p style="font-size:11.5px;color:var(--muted);margin:10px 0 0">No APIs with consumers in this business group.</p>`
        : apiRows;

      return `
      <div style="border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px">
        <!-- Row header — click to toggle -->
        <button onclick="(function(b,d){const open=d.style.display!=='none';d.style.display=open?'none':'block';b.querySelector('.bg-chevron').textContent=open?'▾':'▴'})(this,document.getElementById('${uid}'))"
          style="width:100%;background:none;border:none;cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:12px;text-align:left">
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
              <span style="font-size:12px;font-weight:700;color:var(--title)">${esc(bg.title)}</span>
              <span style="font-size:10.5px;font-weight:600;color:${m.color};background:${m.bg};padding:2px 7px;border-radius:99px">${m.label}</span>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <div style="flex:1;background:var(--line);border-radius:99px;height:6px">
                <div style="height:6px;border-radius:99px;background:${m.bar};width:${barW}%"></div>
              </div>
              <span style="font-size:12px;font-weight:700;color:var(--title);flex-shrink:0;min-width:38px;text-align:right">${pct(bg.reuseRate)}</span>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0;margin-left:8px">
            <span style="font-size:11px;color:var(--muted)">${bg.apisTotal} APIs · ${bg.consumers} consumers</span>
            <span class="bg-chevron" style="font-size:13px;color:var(--muted)">▾</span>
          </div>
        </button>
        <!-- Drill-down panel -->
        <div id="${uid}" style="display:none;border-top:1px solid var(--line);padding:14px 16px;background:var(--surface)">
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px">
            ${[
              ['APIs Analysed',  bg.apisTotal,                            ''],
              ['Reuse Rate',     pct(bg.reuseRate),                       m.color],
              ['Consumers',      bg.consumers,                            ''],
              ['Reused APIs',    bg.consumedMore,                         ''],
              ['Single-consumer',bg.consumedOnce,                         ''],
              ['No Consumers',   bg.consumedNone,                         ''],
            ].map(([lbl,val,col])=>`
            <div style="background:var(--bg);border-radius:8px;padding:9px 11px">
              <div style="font-size:10.5px;color:var(--muted);margin-bottom:2px">${lbl}</div>
              <div style="font-size:15px;font-weight:700;color:${col||'var(--title)'};">${val}</div>
            </div>`).join('')}
          </div>
          <div style="font-size:12px;font-weight:600;color:var(--title);margin-bottom:8px">Top Consumed APIs</div>
          ${noApis}
        </div>
      </div>`;
    }).join('');

    return `
    <div class="card">
      <h3 style="font-size:13px;font-weight:700;color:var(--title);margin:0 0 4px">${dico(TICO.reuse)} Reuse by Business Group</h3>
      <p style="font-size:11.5px;color:var(--muted);margin:0 0 14px">Click a business group to expand its reuse detail and top consumed APIs.</p>
      ${bgRows}
    </div>`;
  })()}

  </div><!-- end row 3 -->

  <!-- ── Row 4: most consumed APIs (full width) ── -->
  <div class="card" style="margin-bottom:26px">
    <h3 style="font-size:13px;font-weight:700;color:var(--title);margin:0 0 6px">${dico(TICO.ins)} Most Consumed APIs</h3>
    <p style="font-size:11.5px;color:var(--muted);margin:0 0 14px">APIs ranked by number of consumers in the production dependency graph. Only APIs with at least one consumer are shown.</p>
    ${ra.perApp.length === 0 ? `<p style="color:var(--muted);font-size:12px">No APIs with consumers found in production graph.</p>` : (()=>{
        const maxC = ra.perApp[0].consumers || 1;
        const renderBar = a => {
          const barW = Math.round(a.consumers/maxC*100);
          const lc = layerColor(a.layer);
          const ll = layerLabel(a.layer);
          return `<div style="margin:10px 0">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px">
              <div style="display:flex;align-items:center;gap:6px;min-width:0">
                <span style="width:7px;height:7px;border-radius:50%;background:${lc};flex-shrink:0" title="${ll}"></span>
                <span style="font-size:12px;font-weight:600;color:var(--title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:400px" title="${esc(a.name)}">${esc(a.name)}</span>
              </div>
              <span style="font-size:12px;font-weight:700;color:var(--title);flex-shrink:0;margin-left:8px">${a.consumers} <span style="font-weight:400;color:var(--muted)">consumer${a.consumers!==1?'s':''}</span></span>
            </div>
            <div style="background:var(--line);border-radius:99px;height:5px">
              <div style="height:5px;border-radius:99px;background:${lc};width:${barW}%"></div>
            </div>
          </div>`;
        };
        const top10 = ra.perApp.slice(0,10).map(renderBar).join('');
        const rest  = ra.perApp.slice(10);
        const uid   = 'ra-more-' + Math.random().toString(36).slice(2);
        const extra = rest.length === 0 ? '' : `
          <div id="${uid}" style="display:none">${rest.map(renderBar).join('')}</div>
          <button onclick="(function(b,d){d.style.display=d.style.display==='none'?'block':'none';b.textContent=d.style.display==='none'?'Show all ${ra.perApp.length} APIs ▾':'Show less ▴'})(this,document.getElementById('${uid}'))"
            style="margin-top:8px;background:none;border:1px solid var(--line);border-radius:6px;padding:5px 12px;font-size:11.5px;color:var(--muted);cursor:pointer;width:100%">Show all ${ra.perApp.length} APIs ▾</button>`;
        return top10 + extra;
      })()
    }
    <div style="display:flex;gap:14px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)">
      ${[['experience','var(--exp)'],['process','var(--proc)'],['system','var(--sys)'],['other','var(--muted)']].map(([l,c])=>`
      <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)">
        <span style="width:8px;height:8px;border-radius:50%;background:${c}"></span>${l.charAt(0).toUpperCase()+l.slice(1)}
      </div>`).join('')}
    </div>
  </div>

  ${renderNoConsumers(ra)}

  </div>`;
}

// ── Reuse tab: production APIs with no consumers ──
function renderNoConsumers(ra){
  const layerColor = l => l==='experience'?'var(--exp)':l==='process'?'var(--proc)':l==='system'?'var(--sys)':'var(--muted)';
  const layerLabel = l => l==='experience'?'Experience':l==='process'?'Process':l==='system'?'System':'Other';
  const list = ra.noConsumers || [];
  if(!list.length) return `
  <div class="card">
    <h3 style="font-size:13px;font-weight:700;color:var(--title);margin:0 0 6px">${dico(TICO.ins)} APIs with No Consumers</h3>
    <p style="font-size:12px;color:var(--muted);margin:0">Every production API has at least one consumer in the dependency graph.</p>
  </div>`;
  const outbound = list.filter(a => a.calls > 0), idle = list.filter(a => a.calls === 0);
  const multiBG = new Set(list.map(a => a.bg).filter(Boolean)).size > 1;
  const stChip = st => {
    if(!st) return '<span style="color:var(--muted)">—</span>';
    const run = ['RUNNING','STARTED','SCALING'].includes(st);
    return `<span style="font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;${run
      ? 'background:var(--ok-bg);color:var(--ok-tx)' : 'background:var(--warn-bg);color:var(--warn-tx)'}">${esc(st.charAt(0)+st.slice(1).toLowerCase())}</span>`;
  };
  const row = a => `<tr style="border-top:1px solid var(--line)">
      <td style="padding:7px 8px 7px 0;font-size:12px;font-weight:600;color:var(--title);word-break:break-all">
        <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${layerColor(a.layer)};margin-right:6px" title="${layerLabel(a.layer)}"></span>${esc(a.name)}</td>
      <td style="padding:7px 8px;font-size:12px;color:var(--muted)">${layerLabel(a.layer)}</td>
      ${multiBG ? `<td style="padding:7px 8px;font-size:12px;color:var(--muted)">${esc(a.bg||'')}</td>` : ''}
      <td style="padding:7px 8px;font-size:12px;color:var(--title);text-align:right">${a.calls ? a.calls + (a.callsMule ? ` <span style="color:var(--muted)">(${a.callsMule} Mule)</span>` : '') : '<span style="color:var(--muted)">none</span>'}</td>
      <td style="padding:7px 0 7px 8px;text-align:right">${stChip(a.status)}</td>
    </tr>`;
  const table = (rows, title, note) => !rows.length ? '' : `
    <div style="margin-top:14px">
      <div style="font-size:12px;font-weight:700;color:var(--title)">${title} <span style="font-weight:400;color:var(--muted)">· ${rows.length}</span></div>
      <div style="font-size:11.5px;color:var(--muted);margin:2px 0 6px">${note}</div>
      <table style="width:100%;border-collapse:collapse;table-layout:fixed">
        <colgroup><col style="width:${multiBG?'40':'55'}%"><col style="width:12%">${multiBG?'<col style="width:22%">':''}<col style="width:14%"><col></colgroup>
        <thead><tr style="font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left">
          <th style="padding:4px 8px 4px 0;font-weight:600">API</th><th style="padding:4px 8px;font-weight:600">Layer</th>
          ${multiBG ? '<th style="padding:4px 8px;font-weight:600">Business group</th>' : ''}
          <th style="padding:4px 8px;font-weight:600;text-align:right">Calls out to</th>
          <th style="padding:4px 0 4px 8px;font-weight:600;text-align:right">Status</th></tr></thead>
        <tbody>${rows.map(row).join('')}</tbody>
      </table>
    </div>`;
  return `
  <div class="card">
    <h3 style="font-size:13px;font-weight:700;color:var(--title);margin:0 0 6px">${dico(TICO.ins)} APIs with No Consumers</h3>
    <p style="font-size:11.5px;color:var(--muted);margin:0">${list.length} of ${ra.apisTotal} production APIs have no consumer in the dependency graph: no client application and no other component calls them. They count towards <b>APIs analysed</b> but not towards reuse.</p>
    ${table(outbound, 'Calls out, but nothing calls in',
      'Usually batch, scheduled, listener or event-driven apps (they start work themselves), or APIs whose callers are not visible to Anypoint Visualizer.')}
    ${table(idle, 'No observed dependencies at all',
      'No traffic in or out during the observation period. Candidates to confirm: new, low-volume, superseded or no longer needed.')}
  </div>`;
}

function show(id){
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.id===id));
  const main = document.getElementById('main');
  main.innerHTML = `<div class="panel active" id="p-${id}">${R[id]()}</div>`;
  main.classList.toggle('wide', id==='flows');   // graph uses the full window width
  if(id==='flows'){ _graphZoom = null; requestAnimationFrame(buildGraph); }
  if(id==='inv') wireInv();
  location.hash = id;
}

document.getElementById('tabs').innerHTML = TABS.map(t =>
  `<button data-id="${t.id}">${t.ico}${t.label}</button>`).join('');
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => show(b.dataset.id)));
const _initial = (location.hash||'').slice(1);
show(_initial in R ? _initial : 'overview');
</script>
</body>
</html>
